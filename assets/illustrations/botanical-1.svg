    <!-- Leaf Pair 2 -->
    <path d="M 93 160 Q 55 140 40 150 Q 65 170 93 160 Z" />
    <path d="M 105 140 Q 145 120 160 130 Q 135 150 105 140 Z" />
    <!-- Leaf Pair 3 -->
    <path d="M 92 100 Q 60 80 50 90 Q 70 110 92 100 Z" />
    <path d="M 103 80 Q 138 65 150 75 Q 130 95 103 80 Z" />
